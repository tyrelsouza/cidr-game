apiVersion: apps/v1
kind: Deployment
metadata:
  name: cidr-node
  labels:
    app.kubernetes.io/name: cidr-node
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cidr-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cidr-node
    spec:
      containers:
        - name: node
          image: cidr-game-node:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
